# Публікація анкети на GitHub Pages.
# У Pages потрапляє лише статична сторінка (index.html + assets/) —
# схема БД, аналітика й деплой-конфіги лишаються тільки в репо.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - methodology/v2-facts.json
      - methodology/build-v2-question-bank.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Згенерувати публічний банк питань v2
        run: node methodology/build-v2-question-bank.mjs

      - name: Зібрати лише статику
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d assets ]; then cp -R assets _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
