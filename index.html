<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#1f1a16; --ink-900:#2d2621; --ink-800:#342c26; --ink-700:#3a322c;
  --ink-600:#433a31; --ink-500:#4a4039; --ink-400:#59493e; --ink-300:#6e5c4b;
  --fg-1:#ece5d8; --fg-2:#c5bcac; --fg-3:#a2937f; --fg-4:#7d6f5d;
  --tan:#c0a080; --tan-bright:#d6bd9c; --tan-deep:#a67c52; --clay:#b3906f;
  --success:#7e9460; --warning:#c79a4a; --danger:#b54a35;
  --grad:linear-gradient(100deg,var(--tan-bright) 0%,var(--tan-deep) 48%,#735a3a 100%);
  --r:14px; --maxw:780px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 110% at 50% 0%,#3a322c 0%,var(--ink-900) 46%,var(--void) 100%) fixed;
  color:var(--fg-1);
  font:400 16px/1.6 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 96px}
.brand{font-family:Jost,sans-serif;font-weight:300;letter-spacing:.34em;text-transform:uppercase;
  font-size:13px;color:var(--fg-3)}
h1{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;
  font-size:clamp(30px,5.2vw,46px);line-height:1.12;margin:18px 0 14px}
h2{font-family:"Hanken Grotesk",sans-serif;font-weight:800;font-size:clamp(20px,3.4vw,25px);
  line-height:1.22;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700;margin:0 0 10px}
p{margin:0 0 14px;color:var(--fg-2)}
.lead{font-size:17.5px;color:var(--fg-2)}
.muted{color:var(--fg-3);font-size:14.5px}
.tiny{color:var(--fg-4);font-size:13px;line-height:1.55}
a{color:var(--tan-bright)}
.card{background:var(--ink-800);border:1px solid var(--ink-400);border-radius:var(--r);padding:22px}
.card + .card{margin-top:16px}
.note{background:rgba(192,160,128,.07);border-left:2px solid var(--tan-deep);
  border-radius:0 8px 8px 0;padding:12px 16px;margin:0 0 18px}
.note p:last-child{margin-bottom:0}

/* поступ */
.bar{position:sticky;top:0;z-index:20;background:rgba(45,38,33,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--ink-400);
  margin:-32px -20px 26px;padding:12px 20px}
.bar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px}
.track{flex:1;height:4px;background:var(--ink-600);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--grad);border-radius:99px;transition:width .35s ease}
.step-n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--fg-3);white-space:nowrap}

/* питання */
.q{border-top:1px solid var(--ink-600);padding:24px 0 4px}
.q:first-of-type{border-top:0;padding-top:6px}
.q-n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--tan-deep);
  letter-spacing:.08em;margin-bottom:7px}
.q-t{font-weight:600;font-size:17px;line-height:1.4;margin-bottom:14px;color:var(--fg-1)}
.q-hint{font-size:14px;color:var(--fg-3);margin:-8px 0 14px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;
  background:var(--ink-700);border:1px solid var(--ink-500);border-radius:10px;
  transition:border-color .15s,background .15s}
label.opt:hover{border-color:var(--ink-300);background:var(--ink-600)}
label.opt.on{border-color:var(--tan);background:rgba(192,160,128,.11)}
label.opt input{margin:3px 0 0;accent-color:var(--tan);flex:none;width:16px;height:16px}
.opt-b{flex:1;min-width:0}
.opt-lv{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--fg-4);
  letter-spacing:.06em;display:block;margin-bottom:2px}
.opt-x{font-size:15.5px;line-height:1.45;color:var(--fg-2)}
label.opt.on .opt-x{color:var(--fg-1)}
label.opt.na{background:transparent;border-style:dashed;border-color:var(--ink-400)}
label.opt.na .opt-x{color:var(--fg-3);font-size:15px}
label.opt.na.on{background:rgba(125,111,93,.14);border-color:var(--fg-4);border-style:solid}
.free{margin-top:9px}
input[type=text],textarea,select{
  width:100%;background:var(--ink-700);color:var(--fg-1);border:1px solid var(--ink-400);
  border-radius:9px;padding:11px 13px;font:400 15.5px/1.5 "Hanken Grotesk",sans-serif}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--tan)}
input::placeholder{color:var(--fg-4)}
.err{border-color:var(--danger)!important}
.err-msg{color:var(--danger);font-size:14px;margin-top:8px}

/* кнопки */
.nav{display:flex;gap:12px;margin-top:30px;align-items:center}
button{font:600 15.5px/1 "Hanken Grotesk",sans-serif;border-radius:10px;cursor:pointer;
  padding:14px 26px;border:1px solid transparent;transition:opacity .15s,transform .1s}
button:active{transform:translateY(1px)}
.primary{background:var(--grad);color:#241c14;border:0;font-weight:700}
.primary:hover{opacity:.92}
.ghost{background:transparent;color:var(--fg-2);border-color:var(--ink-400)}
.ghost:hover{border-color:var(--fg-4);color:var(--fg-1)}
.spacer{flex:1}
button[disabled]{opacity:.5;cursor:not-allowed}

/* результат */
.big{font-family:"JetBrains Mono",monospace;font-size:clamp(42px,10vw,66px);font-weight:500;
  line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.lvl{font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(23px,4.4vw,31px);
  margin:12px 0 4px;color:var(--fg-1)}
.dom{display:grid;grid-template-columns:1fr auto;gap:5px 14px;align-items:center;margin:9px 0}
.dom-n{font-size:15px;color:var(--fg-2)}
.dom-v{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--fg-1)}
.dom-tr{grid-column:1/-1;height:6px;background:var(--ink-600);border-radius:99px;overflow:hidden}
.dom-f{height:100%;background:var(--grad);border-radius:99px}
.dom-f.none{background:var(--ink-400)}
.status{font-size:14.5px;padding:11px 15px;border-radius:9px;margin-top:18px}
.status.ok{background:rgba(126,148,96,.13);color:#a8bd86;border:1px solid rgba(126,148,96,.3)}
.status.wait{background:rgba(199,154,74,.11);color:var(--warning);border:1px solid rgba(199,154,74,.28)}
.status.bad{background:rgba(181,74,53,.12);color:#d1836f;border:1px solid rgba(181,74,53,.32)}
hr{border:0;border-top:1px solid var(--ink-600);margin:26px 0}
@media (max-width:560px){
  .wrap{padding:22px 15px 80px} .bar{margin:-22px -15px 20px;padding:11px 15px}
  .card{padding:17px} button{padding:13px 20px;font-size:15px}
}
</style>

<script>

  {k:"data",       t:"Готовність даних",                    w:.11, i:["q16","q17","q18","q19","q20"],          m:3},
  {k:"tech",       t:"Технології та архітектура",           w:.07, i:["q21","q22","q23","q24"],                m:2},
  {k:"people",     t:"Люди, культура та операційна модель", w:.14, i:["q26","q27","q28","q29","q30","q31","q32"], m:4},

/* --- питання ---------------------------------------------------------------
   d — домен · o — п'ять рівнів зрілості · ev — evidence (не дає балів)

   --------------------------------------------------------------------------- */
const Q = [
/* 1. Стратегія та лідерство */
{id:"q1",d:"strategy",t:"Яку роль ШІ фактично відіграє у стратегії організації?",o:[

 "AI governance та accountability є частиною operating model організації й регулярно розглядаються керівництвом."]},

{id:"q5",ev:1,t:"Які елементи формального управління AI вже існують?",
 hint:"Можна вибрати декілька. Це питання не дає балів — воно перевіряє, що саме існує фактично.",

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Умова показу агентного блоку — методологія v1.2 §3 */
function agenticShown(){
  if (S.c5.includes("automation") || S.c5.includes("agents")) return true;
  if (typeof S.ans.q11 === "number" && S.ans.q11 >= 3) return true;
  return ["executive","it_data"].includes(roleGroup());
}
function roleGroup(){
  const f = FUNCTIONS.find(f => f[0] === S.c2);
  return f ? f[2] : "business";
}
function activeSteps(){
  return STEPS.map((s,i) => i).filter(i => !STEPS[i].agentic || agenticShown());
}

/* --- рендер питань --------------------------------------------------------- */
function optHtml(id, val, label, lvl, checked, cls){
  return `<label class="opt ${cls||""} ${checked?"on":""}">
    <input type="radio" name="${id}" value="${val}" ${checked?"checked":""}>
    <span class="opt-b">${lvl?`<span class="opt-lv">${lvl}</span>`:""}<span class="opt-x">${esc(label)}</span></span>
  </label>`;
}

function questionHtml(q, n){
  const bad = showedErrors && !answered(q);
  let body = "";

  if (q.ev){
    const st = S.ev[q.id] || {selected:[], unknown:false, none:false};
    body = `<div class="opts">` + q.items.map(([k,label]) => `
      <label class="opt ${st.selected.includes(k)?"on":""}">
        <input type="checkbox" data-ev="${q.id}" value="${k}" ${st.selected.includes(k)?"checked":""}
               ${st.unknown||st.none?"disabled":""}>
        <span class="opt-b"><span class="opt-x">${esc(label)}</span></span>
      </label>`).join("") + `
      <label class="opt na ${st.none?"on":""}">
        <input type="checkbox" data-ev-none="${q.id}" ${st.none?"checked":""} ${st.unknown?"disabled":""}>
        <span class="opt-b"><span class="opt-x">Жодного з переліченого</span></span>
      </label>
      <label class="opt na ${st.unknown?"on":""}">
        <input type="checkbox" data-ev-unknown="${q.id}" ${st.unknown?"checked":""} ${st.none?"disabled":""}>
        <span class="opt-b"><span class="opt-x">Не знаю / не можу оцінити</span></span>
      </label></div>`;
  } else {
    const cur = S.ans[q.id];
    const isFree = cur === null && S.free[q.id] !== undefined;
    const isNa   = cur === null && S.free[q.id] === undefined;
    body = `<div class="opts">` +
      q.o.map((label,i) => optHtml(q.id, i+1, label, q.quant?"":`Рівень ${i+1}`, cur === i+1)).join("") +
      optHtml(q.id, "free", "Інше / свій варіант", "", isFree, "na") +
      (isFree ? `<div class="free"><input type="text" data-free="${q.id}" value="${esc(S.free[q.id]||"")}"
                  placeholder="Опишіть, як це влаштовано у вас"></div>` : "") +
      optHtml(q.id, "na", q.na ? `${q.na} / не знаю` : "Не знаю / не можу оцінити", "", isNa, "na") +
      `</div>`;
  }

  return `<div class="q" id="wrap-${q.id}">
    <div class="q-n">${n}</div>
    <div class="q-t">${esc(q.t)}</div>
    ${q.hint?`<div class="q-hint">${esc(q.hint)}</div>`:""}
    ${body}
    ${bad?`<div class="err-msg">Оберіть варіант або позначте «не знаю».</div>`:""}
  </div>`;
}

function render(){
  const app = $("#app"), bar = $("#bar");
  if (step === -1){ bar.hidden = true; app.innerHTML = intro();
    $("#go").onclick = () => { step = 0; showedErrors = false; render(); }; save(); return; }

  const act = activeSteps();
  if (step >= STEPS.length){ bar.hidden = true; app.innerHTML = resultHtml(); bindResult(); return; }

  const s = STEPS[step], pos = act.indexOf(step) + 1;
  bar.hidden = false;
  $("#fill").style.width = (pos / (act.length + 1) * 100) + "%";
  $("#stepN").textContent = `${pos} / ${act.length}`;

  app.innerHTML = `<h2>${esc(s.t)}</h2>
    ${s.sub?`<p class="muted">${esc(s.sub)}</p>`:""}
    <div class="card">
      ${s.ctx ? contextHtml()
              : s.ids.map((id,i) => questionHtml(QBY[id], `Питання ${i+1} з ${s.ids.length}`)).join("")}
    </div>
    <div class="nav">
      ${pos>1?`<button class="ghost" id="prev">Назад</button>`:""}
      <div class="spacer"></div>
      <button class="primary" id="next">${pos===act.length?"Завершити":"Далі"}</button>
    </div>`;

  bind();
  window.scrollTo({top:0, behavior:"instant"});
}

function bind(){
  document.querySelectorAll("input[type=radio]").forEach(el => el.onchange = onRadio);
  document.querySelectorAll("input[type=checkbox]").forEach(el => el.onchange = onCheck);
  document.querySelectorAll("input[type=text]").forEach(el => el.oninput = onText);
  const p = $("#prev"), n = $("#next");
  if (p) p.onclick = () => { const a = activeSteps(); step = a[a.indexOf(step)-1]; showedErrors = false; render(); };
  if (n) n.onclick = onNext;
}

function onRadio(e){
  const name = e.target.name, v = e.target.value;
  if (name === "c1"){ S.c1 = v; }
  else if (name === "c2"){ S.c2 = v; }
  else if (name === "c3"){ S.c3 = +v; }
  else if (name === "c4"){ S.c4 = +v; }
  else {
    if (v === "na"){ S.ans[name] = null; delete S.free[name]; }
    else if (v === "free"){ S.ans[name] = null; S.free[name] = S.free[name] || ""; }
    else { S.ans[name] = +v; delete S.free[name]; }
  }
  save(); render();
}

function onCheck(e){
  const t = e.target;
  if (t.dataset.c5 !== undefined){
    const k = t.dataset.c5;
    if (t.checked){
      if (k === "none" || k === "unknown") S.c5 = [k];
      else S.c5 = S.c5.filter(x => x !== "none" && x !== "unknown").concat(k);
    } else S.c5 = S.c5.filter(x => x !== k);
  } else if (t.dataset.ev !== undefined){
    const id = t.dataset.ev, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.selected = t.checked ? st.selected.concat(t.value) : st.selected.filter(x => x !== t.value);
  } else if (t.dataset.evNone !== undefined){
    const id = t.dataset.evNone, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.none = t.checked; if (t.checked) st.selected = [];
  } else if (t.dataset.evUnknown !== undefined){
    const id = t.dataset.evUnknown, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.unknown = t.checked; if (t.checked) st.selected = [];
  }
  save(); render();
}

function onText(e){
  const t = e.target;
  if (t.id === "org") S.org = t.value;
  else if (t.dataset.free !== undefined) S.free[t.dataset.free] = t.value;
  else if (t.dataset.cfree === "c1") S.c1_free = t.value;
  else if (t.dataset.cfree === "c2") S.c2_free = t.value;
  save();                                    // без render(): не збиваємо курсор
}

/* --- валідація ------------------------------------------------------------- */
function answered(q){
  if (q.ev){ const st = S.ev[q.id]; return !!st && (st.selected.length > 0 || st.unknown || st.none); }
  return S.ans[q.id] !== undefined;
}
function stepValid(){
  const s = STEPS[step];
  if (s.ctx) return S.org.trim().length >= 2 && !!S.c1 && !!S.c2 && !!S.c3 && !!S.c4 && S.c5.length > 0;
  return s.ids.every(id => answered(QBY[id]));
}
function onNext(){
  if (!stepValid()){ showedErrors = true; render();
    const bad = document.querySelector(".err-msg"); if (bad) bad.scrollIntoView({block:"center"});
    return; }
  showedErrors = false;
  const act = activeSteps(), i = act.indexOf(step);
  if (i + 1 < act.length){ step = act[i+1]; render(); }
  else { step = STEPS.length; render(); submit(); }
}

/* --- індивідуальний бал ----------------------------------------------------
   Рахуємо лише власну оцінку респондента. Enterprise aggregate, Alignment,
   Confidence і gates рахуються на сервері — вони за визначенням потребують
   усіх респондентів організації.
   --------------------------------------------------------------------------- */
function domainScores(){
  const out = {};
  for (const d of DOMAINS){
    if (d.k === "agentic" && !agenticShown()){ out[d.k] = null; continue; }
    const vals = d.i.map(id => S.ans[id]).filter(v => typeof v === "number");
    out[d.k] = vals.length >= d.m ? +(vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(3) : null;
  }
  return out;
}
function score(){
  const ds = domainScores();
  let num = 0, den = 0;
  for (const d of DOMAINS) if (ds[d.k] !== null){ num += ds[d.k] * d.w; den += d.w; }
  return den ? +(num / den).toFixed(2) : null;
}
function levelOf(sc){
  if (sc === null) return null;
  return LEVELS.find(([lo,hi]) => sc >= lo && sc <= hi) || LEVELS[LEVELS.length-1];
}

      return `<div class="dom">
        <span class="dom-n">${esc(d.t)}</span>

function bindResult(){
  $("#dl").onclick = download;
  setStatus(S.sent);
}
function setStatus(state){
  const el = $("#sendStatus"); if (!el) return;
  if (state === "ok")        el.innerHTML = `<div class="status ok">Відповіді надіслані.</div>`;
  else if (state === "wait") el.innerHTML = `<div class="status wait">Надсилаємо…</div>`;
  else if (state === "local")el.innerHTML = `<div class="status wait">Локальний режим: сервер не налаштований. Збережіть копію відповідей і передайте її консультанту.</div>`;
  else if (state === "err")  el.innerHTML = `<div class="status bad">Не вдалося надіслати відповіді. Збережіть копію й передайте консультанту.</div>`;
  else el.innerHTML = "";
}

/* --- payload і надсилання --------------------------------------------------- */
function payload(){
  const shown = agenticShown();
  const answers = {}, evidence = {};
  for (const q of Q){
    const isAgentic = (q.d === "agentic") || q.id === "q43";
    if (isAgentic && !shown) continue;
    if (q.ev){
      const st = S.ev[q.id] || {selected:[], unknown:false};
      evidence[q.id] = {selected: st.selected, unknown: !!st.unknown};
    } else {
      answers[q.id] = S.ans[q.id] === undefined ? null : S.ans[q.id];
    }
  }
  const fn = FUNCTIONS.find(f => f[0] === S.c2);
  return {
    version: VERSION,
    org_name: S.org.trim(),
    role_group: roleGroup(),
    c1_role: S.c1 === "free" ? S.c1_free : S.c1,
    c2_function: S.c2 === "other" ? (S.c2_free || "Інше") : (fn ? fn[1] : S.c2),
    c3_scope: S.c3, c4_awareness: S.c4,
    c5_types: S.c5,
    answers, evidence,
    free_text: S.free,
    domains: domainScores(),
    score: score(),
    agentic_shown: shown,
    duration_sec: Math.round((Date.now() - S.started) / 1000),
  };
}

function submit(){
  if (!API_URL){ S.sent = "local"; setStatus("local"); save(); return; }
  S.sent = "wait"; setStatus("wait");
  fetch(API_URL.replace(/\/+$/, "") + "/responses", {
    method:"POST",
    headers:{"Content-Type":"application/json","Prefer":"return=minimal"},
    body: JSON.stringify(payload()),
  }).then(r => {
    S.sent = r.ok ? "ok" : "err";
    if (!r.ok) console.error("POST /responses", r.status);
    setStatus(S.sent); save();
  }).catch(e => { console.error(e); S.sent = "err"; setStatus("err"); save(); });
}

function download(){
  const blob = new Blob([JSON.stringify(payload(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ai-readiness-" + (S.org.trim().replace(/\s+/g,"-").toLowerCase() || "response") + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}

/* --- збереження в браузері -------------------------------------------------- */
const KEY = "ainoia-ard-v" + VERSION;
function save(){ try { localStorage.setItem(KEY, JSON.stringify({S, step})); } catch(e){} }
function restore(){
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.S){ Object.assign(S, d.S); if (typeof d.step === "number") step = d.step; }
  } catch(e){}
}

/* --- старт ------------------------------------------------------------------ */
