<!doctype html>
<html lang="uk">
<title>AI Readiness Diagnostic — AInoia</title>
<meta charset="utf-8">
<meta name="theme-color" content="#f6f4ef">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   AInoia — AI Readiness Diagnostic · HeroUI v3 anatomy × AInoia colour scheme
   Компонентна анатомія: HeroUI v3 (surface / field / accent-soft / tiles).
   Кольори: AInoia Design System, [data-theme="light"] — warm off-white paper
   canvas (tokens/colors.css, guidelines/color-light-theme). Accent = tan→bronze
   --grad-cta, текст на акценті --fg-on-accent, clay лише для danger.
   ========================================================================== */
:root{
  color-scheme:light;
  /* AInoia light theme — surfaces */
  --surface-page:#f6f4ef; --surface-raised:#fbfaf7; --surface-sunken:#eeebe3; --hairline:#e5e0d6; --marble-300:#d8d1c2;
  /* AInoia light theme — ink */
  --ink:#211e18; --ink-muted:#6e6557; --ink-faint:#6e6557; --ink-ghost:#b5ac9e;
  /* AInoia accents (warm) */
  --tan:#c0a080; --tan-bright:#d6bd9c; --tan-deep:#a67c52; --bronze:#8d6e4c; --clay:#b3906f;
  --grad-cta:linear-gradient(100deg,var(--tan-bright) 0%,var(--tan-deep) 100%);
  --fg-on-accent:#241a10;
  --accent-tint:rgba(192,160,128,.10); --accent-tint-strong:rgba(192,160,128,.16); --accent-border:rgba(192,160,128,.40);
  /* AInoia light theme — status */
  --success:#6f8a52; --warning:#a97a2e; --danger:#a23c2e;
  --success-tint:rgba(111,138,82,.12); --success-border:rgba(111,138,82,.40);
  --warning-tint:rgba(169,122,46,.12); --warning-border:rgba(169,122,46,.40);
  --danger-tint:#f4e2dd; --danger-border:rgba(162,60,46,.40);
  --border-subtle:rgba(33,30,24,.05); --border-default:var(--hairline); --border-strong:rgba(33,30,24,.16);
  --focus-ring:#7a5c3c;

  /* HeroUI semantic slots → AInoia values */
  --radius:0.5rem; --field-radius:calc(var(--radius) * 1.5); --card-radius:calc(var(--radius) * 2);
  --background:var(--surface-page); --foreground:var(--ink);
  --surface:var(--surface-raised); --surface-secondary:var(--surface-sunken); --surface-tertiary:var(--hairline);
  --muted:var(--ink-muted); --faint:var(--ink-faint);
  --default:var(--surface-sunken); --default-foreground:var(--ink);
  --accent:var(--tan-deep); --accent-text:#7a5c3c; /* 5.6:1 на paper, 5.1:1 на accent-tint */ --accent-foreground:var(--fg-on-accent);
  --accent-soft:var(--accent-tint); --accent-soft-hover:var(--accent-tint-strong);
  --border:var(--hairline); --separator:var(--hairline); --border-secondary:var(--marble-300);
  --field-background:var(--surface-raised); --field-foreground:var(--ink); --field-placeholder:var(--ink-faint);
  --field-border-focus:var(--accent-text);
  --focus:var(--tan-deep);
  --surface-shadow:0 2px 4px 0 rgba(33,30,24,.04),0 1px 2px 0 rgba(33,30,24,.05),0 0 1px 0 rgba(33,30,24,.06);
  --field-shadow:0 2px 4px 0 rgba(33,30,24,.04),0 1px 2px 0 rgba(33,30,24,.05),0 0 1px 0 rgba(33,30,24,.06);
  --glow-cta:none;
  --font-sans:"Inter","Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Jost","Century Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:760px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--background);color:var(--foreground);
  font:400 15px/1.6 var(--font-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"cv11","ss01";
}
::selection{background:rgba(192,160,128,.28);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 96px}

/* типографіка */
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:400;letter-spacing:.34em;
  text-transform:uppercase;font-size:12px;color:var(--ink-muted)}
.brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad-cta);box-shadow:0 0 0 3px var(--accent-tint-strong)}
h1{font-family:var(--font-sans);font-weight:700;letter-spacing:-.025em;
  font-size:clamp(30px,5vw,42px);line-height:1.12;margin:18px 0 12px;color:var(--foreground)}
h2{font-family:var(--font-sans);font-weight:600;font-size:clamp(20px,3.2vw,24px);
  line-height:1.25;margin:0 0 6px;letter-spacing:-.015em;color:var(--foreground)}
h3,.card-h{font-size:16px;font-weight:600;margin:0 0 10px;color:var(--foreground);letter-spacing:-.01em;line-height:1.4}
p{margin:0 0 14px;color:var(--foreground)}
.lead{font-size:17px;color:var(--muted)}
.hook{font-size:15.5px;line-height:1.6;color:var(--foreground);margin:-4px 0 18px}
.muted{color:var(--muted);font-size:14px}
.tiny{color:var(--muted);font-size:12.5px;line-height:1.55}
a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent-border)}
a:hover{text-decoration-color:var(--accent-text)}

/* Card (surface.raised + hairline + surface-shadow) */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:24px;
  box-shadow:none}
.card + .card{margin-top:16px}
/* Alert · faded · primary */
.note{background:var(--accent-tint);border:1px solid var(--accent-border);
  border-radius:var(--field-radius);padding:12px 16px;margin:0 0 18px;color:var(--foreground)}
.note p:last-child{margin-bottom:0}
.note strong{color:var(--accent-text)}

/* Progress (sticky navbar) */
.bar{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.82);
  backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);
  border-bottom:1px solid var(--separator);margin:-32px -20px 26px;padding:12px 20px}
.bar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px}
.track{flex:1;height:8px;background:var(--surface-sunken);border-radius:9999px;overflow:hidden}
.fill{height:100%;background:var(--grad-cta);box-shadow:var(--glow-cta);border-radius:9999px;transition:width .42s cubic-bezier(.22,1,.36,1)}
.step-n{font-family:var(--font-mono);font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* питання */
.q{border-top:1px solid var(--separator);padding:20px 0 16px}
.q:first-of-type{border-top:0;padding-top:4px}
.q-n{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--accent-text);
  background:var(--accent-tint);border:1px solid var(--accent-border);border-radius:9999px;padding:2px 9px;letter-spacing:.04em;margin-bottom:10px;font-weight:500}
.q-t{font-weight:600;font-size:16px;line-height:1.45;margin-bottom:14px;color:var(--foreground);letter-spacing:-.005em}
.q-hint{font-size:13.5px;color:var(--muted);margin:-8px 0 14px}
.opts{display:flex;flex-direction:column;gap:2px}

/* Radio / Checkbox як tile (Radio.Content card pattern) */
label.opt{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:10px 12px;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:var(--field-radius);
  transition:border-color .13s,background .13s,box-shadow .13s,transform .1s;box-shadow:none}
label.opt:hover{background:var(--surface-secondary);border-color:var(--border-strong)}
label.opt:active{transform:scale(.995)}
label.opt.on{border-color:var(--accent-border);background:var(--accent-tint)}
label.opt.on:hover{background:var(--accent-tint-strong)}
/* Radio.Control 20px · 1.5px hairline · dot 45% grad-cta + glow  (DS Radio.jsx) */
label.opt input{appearance:none;-webkit-appearance:none;margin:2px 0 0;flex:none;width:20px;height:20px;cursor:pointer;
  border:1.5px solid var(--ink-muted);background:transparent;border-radius:9999px;display:grid;place-items:center;
  transition:border-color .13s,background .13s,box-shadow .13s,transform .1s}
label.opt input[type=checkbox]{border-radius:6px}
label.opt input:hover{border-color:var(--ink);background:var(--surface-sunken)}
label.opt input:active{transform:scale(.92)}
label.opt input[type=radio]:checked{border-color:var(--tan-deep);background:transparent;box-shadow:var(--glow-cta)}
label.opt input[type=radio]::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--grad-cta);
  transform:scale(0);transition:transform .13s cubic-bezier(.16,1.1,.3,1)}
label.opt input[type=radio]:checked::after{transform:scale(1)}
/* Checkbox: fill grad-cta, mark fg-on-accent (DS Checkbox.jsx) */
label.opt input[type=checkbox]:checked{border-color:var(--accent-text);background:var(--grad-cta);box-shadow:none}
label.opt input[type=checkbox]::after{content:"";width:10px;height:6px;border-left:2.2px solid var(--fg-on-accent);
  border-bottom:2.2px solid var(--fg-on-accent);transform:translateY(-1px) rotate(-45deg) scale(.6);opacity:0;
  transition:transform .13s cubic-bezier(.16,1.1,.3,1),opacity .13s}
label.opt input[type=checkbox]:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1);opacity:1}
label.opt input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
label.opt input[disabled]{opacity:.5;cursor:not-allowed}
.opt-b{flex:1;min-width:0}
.opt-lv{font-family:var(--font-mono);font-size:11px;color:var(--faint);letter-spacing:.04em;display:block;margin-bottom:2px}
.opt-x{font-size:15px;line-height:1.45;color:var(--foreground)}
label.opt.na{background:var(--surface-secondary);border-style:dashed;box-shadow:none}
label.opt.na .opt-x{color:var(--muted);font-size:14.5px}
label.opt.na.on{background:var(--surface-tertiary);border-style:solid;border-color:var(--border-strong)}
label.opt.na input[type=radio]:checked{border-color:var(--ink-muted);box-shadow:none}
label.opt.na input[type=radio]::after{background:var(--ink-muted)}
label.opt.na input[type=checkbox]:checked{background:var(--ink-muted);box-shadow:none}
label.opt.na input[type=checkbox]::after{border-color:var(--surface-raised)}
.free{margin-top:9px}

/* Input (field-*): hairline, field-shadow, ring tan на фокусі */
input[type=text],textarea,select{
  width:100%;height:44px;background:var(--field-background);color:var(--field-foreground);border:1px solid var(--ink-muted);
  border-radius:var(--field-radius);padding:0 14px;font:400 15px/1.5 var(--font-sans);box-shadow:var(--field-shadow);
  transition:box-shadow .13s,border-color .13s}
textarea{height:auto;padding:10px 14px}
input[type=text]:hover,textarea:hover{border-color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--field-border-focus);
  box-shadow:var(--field-shadow),0 0 0 2px var(--background),0 0 0 4px var(--focus-ring)}
input::placeholder{color:var(--field-placeholder)}
.err{border-color:var(--danger)!important;box-shadow:var(--field-shadow),0 0 0 3px var(--danger-tint)!important}
.err-msg{color:var(--danger);font-size:13.5px;margin-top:8px}

/* Контекст запрошення (титульна) */
.invite-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted);margin:-2px 0 18px}
/* Згода й повідомлення про обробку даних (титульна) */
.privacy{margin-top:18px;border:1px solid var(--border);border-radius:var(--field-radius);background:var(--surface);padding:0 16px}
.privacy summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:500;color:var(--foreground)}
.privacy ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.privacy li+li{margin-top:6px}
.privacy strong{color:var(--foreground);font-weight:500}
.privacy a{color:var(--accent-text)}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.5;color:var(--foreground);cursor:pointer}
.consent input[type=checkbox]{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--tan-deep)}
/* Код організації і запрошення */
.code-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.code-label{font-size:13.5px;color:var(--muted)}
.code{font-family:var(--font-mono);font-size:14px;letter-spacing:.08em;background:var(--surface-sunken);border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;color:var(--foreground)}
.invite{display:flex;gap:10px;margin-top:12px}
.invite input[readonly]{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.invite button{flex:none;height:40px}
.lead-form{display:grid;gap:10px;margin-top:14px}
.lead-form button{width:100%}
@media(min-width:560px){.lead-form{grid-template-columns:1fr 1.4fr auto}.lead-form button{width:auto}}

/* Button: primary = grad-cta + fg-on-accent (DS Button), ghost = hairline */
.nav{display:flex;gap:10px;margin-top:28px;align-items:center}
button{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;
  font:600 15px/1 var(--font-sans);border-radius:var(--field-radius);cursor:pointer;border:1px solid transparent;
  transition:background .13s,color .13s,border-color .13s,transform .1s,box-shadow .13s,opacity .13s;user-select:none;white-space:nowrap}
button:active{transform:scale(.97)}
.primary{background:var(--grad-cta);color:var(--fg-on-accent);
  box-shadow:none}
.primary:hover{background:var(--tan-bright)}
.ghost{background:var(--surface-raised);color:var(--foreground);border-color:var(--border-strong)}
.ghost:hover{background:var(--surface-sunken)}
.link-btn{display:inline;height:auto;padding:0;background:none;border:0;font:inherit;font-weight:600;
  color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--tan-deep)}
.spacer{flex:1}
button[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* результат */
.big{font-family:var(--font-sans);font-size:clamp(48px,10vw,72px);font-weight:700;letter-spacing:-.04em;
  line-height:1;background:linear-gradient(100deg,var(--tan-deep) 0%,var(--bronze) 60%,#735a3a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.lvl{font-family:var(--font-sans);font-weight:600;letter-spacing:-.02em;font-size:clamp(21px,4vw,28px);
  margin:12px 0 4px;color:var(--foreground)}
.dom{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;margin:10px 0}
.dom-n{font-size:14.5px;color:var(--foreground)}
.dom-v{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dom-tr{grid-column:1/-1;height:8px;background:var(--surface-sunken);border-radius:9999px;overflow:hidden}
.dom-f{height:100%;background:var(--grad-cta);border-radius:9999px}
.dom-f.none{background:var(--marble-300)}
/* Alert · faded · success / warning / danger */
.status{font-size:14px;padding:12px 16px;border-radius:var(--field-radius);margin-top:18px;border:1px solid transparent;color:var(--foreground)}
.status.ok{background:var(--success-tint);border-color:var(--success-border);color:#4c6136}
.status.wait{background:var(--warning-tint);border-color:var(--warning-border);color:#7a561f}
.status.bad{background:var(--danger-tint);border-color:var(--danger-border);color:var(--danger)}
hr{border:0;border-top:1px solid var(--separator);margin:26px 0}

.intro-guide{border-left:3px solid var(--tan-deep);padding:4px 0 4px 18px;margin:22px 0 16px}
.definition{margin:16px 0;color:var(--muted);font-size:14px}
.definition summary{cursor:pointer;padding:6px 0}
.definition p{margin:8px 0 0}
.field-label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
label.q-t{display:block}
.lead-form{align-items:end}
.progress-detail{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}
.q{scroll-margin-top:110px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
label.opt:has(input:disabled){cursor:not-allowed}
@media (max-width:560px){
  .wrap{padding:22px 15px 80px} .bar{margin:-22px -15px 20px;padding:11px 15px}
  .card{padding:18px} button{padding:0 18px;font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="bar-in">
      <span class="brand">AInoia</span>
      <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
      <span class="step-n" id="stepN"></span>
    </div>
    <div class="progress-detail"><span id="answeredN"></span><span id="draftStatus" role="status" aria-live="polite"></span></div>
  </div>
  <main id="app"></main>
  <p class="sr-only" id="formFeedback" role="alert" aria-atomic="true"></p>
</div>

/* --- v2 fact helpers --- */
function deriveFactAnswer(state){
  if (!state || state.unknown) return null;
  if (state.none) return 1;
  const checked = new Set((state.checked || []).filter(level => Number.isInteger(level) && level >= 2 && level <= 5));
  let answer = 1;
  for (let level = 2; level <= 5 && checked.has(level); level++) answer = level;
  return answer;
}
function factFlags(state){
  if (!state || state.none || state.unknown) return [];
  const answer = deriveFactAnswer(state);
  return [...new Set(state.checked || [])].filter(level => Number.isInteger(level) && level > answer).sort((a,b) => a - b);
}
function isFactAnswered(state){
  return !!state && (state.none || state.unknown || (state.checked || []).length > 0);
}

function render(){
  const focusedId = document.activeElement?.id;
  const changedStep = renderedStep !== step;
  const app = $("#app"), bar = $("#bar");
  if (step === -1){ bar.hidden = true; app.innerHTML = intro();
    $("#consent").onchange = e => { S.consentAt = e.target.checked ? new Date().toISOString() : null;
      $("#go").disabled = !S.consentAt; save(); };
    $("#go").onclick = () => { if (!S.consentAt) return; step = 0; showedErrors = false; render(); };
    save(); return; }

  const act = activeSteps();
  if (step >= STEPS.length){ bar.hidden = true; app.innerHTML = resultHtml(); bindResult();
    const heading = app.querySelector?.("h1");
    if (changedStep && heading){ heading.tabIndex = -1; heading.focus(); }
    else if (focusedId) document.getElementById?.(focusedId)?.focus({preventScroll:true});
    renderedStep = step; return; }

  const s = STEPS[step], pos = act.indexOf(step) + 1;
  bar.hidden = false;
  $("#fill").style.width = (pos / (act.length + 1) * 100) + "%";
  $("#stepN").textContent = `Крок ${pos} із ${act.length}`;

  app.innerHTML = `<h2>${esc(s.t)}</h2>
    ${s.sub?`<p class="muted">${esc(s.sub)}</p>`:""}
    ${s.ctx ? "" : `<p class="q-hint">Галочка — лише там, де є приклад або документ. Не знаю — нормально.</p>`}
    <div class="card">
      ${s.ctx ? contextHtml()
              : s.ids.map(id => questionHtml(QBY[id], `Питання ${id.slice(1)} із 43`)).join("")}
    </div>
    <div class="nav">
      ${pos>1?`<button class="ghost" id="prev">Назад</button>`:""}
      <div class="spacer"></div>
      <button class="primary" id="next">${pos===act.length?"Завершити":"Далі"}</button>
    </div>`;

  enhanceQuestionSemantics();
  updateProgress();
  bind();
  if (changedStep){
    const heading = app.querySelector("h2"); heading.tabIndex = -1; heading.focus({preventScroll:true});
  } else if (focusedId) document.getElementById(focusedId)?.focus({preventScroll:true});
  if (renderedStep !== step) window.scrollTo({top:0, behavior:"instant"});
  renderedStep = step;
}

// Associate each question, hint and validation error with its controls.
function enhanceQuestionSemantics(){
  document.querySelectorAll(".q").forEach((q, index) => {
    const prefix = `step-${step}-question-${index}`;
    const title = q.querySelector(".q-t"), hint = q.querySelector(".q-hint"), error = q.querySelector(".err-msg");
    title.id = `${prefix}-title`;
    q.setAttribute("role", "group"); q.setAttribute("aria-labelledby", title.id);
    const descriptions = [];
    if (hint){ hint.id = `${prefix}-hint`; descriptions.push(hint.id); }
    if (error){ error.id = `${prefix}-error`; descriptions.push(error.id); }
    q.querySelectorAll("input").forEach((input, i) => {
      if (!input.id) input.id = `${prefix}-input-${i}`;
      if (descriptions.length) input.setAttribute("aria-describedby", descriptions.join(" "));
      input.setAttribute("aria-invalid", String(!!error));
      if (input.type === "text" && !input.labels.length){
        const label = document.createElement("label");
        label.htmlFor = input.id; label.className = "field-label";
        label.textContent = input.placeholder || title.textContent;
        input.before(label);
      }
    });
  });
}
function updateProgress(){
  const s = STEPS[step]; if (!s) return;
  const answeredCount = s.ctx
    ? [S.org.trim().length >= 2, !!S.c1, !!S.c2, !!S.c3, !!S.c4, S.c5.length > 0].filter(Boolean).length
    : s.ids.filter(id => answered(QBY[id])).length;
  const total = s.ctx ? 6 : s.ids.length;
  $("#answeredN").textContent = `У розділі: ${answeredCount} із ${total} відповідей`;
  updateDraftStatus();
}

function bind(){
  document.querySelectorAll("input[type=radio]").forEach(el => el.onchange = onRadio);
  document.querySelectorAll("input[type=checkbox]").forEach(el => el.onchange = onCheck);
  document.querySelectorAll("input[type=text]").forEach(el => el.oninput = onText);
  const p = $("#prev"), n = $("#next");
  if (p) p.onclick = () => { const a = activeSteps(); step = a[a.indexOf(step)-1]; showedErrors = false; render(); };
  if (n) n.onclick = onNext;
  const newOrg = $("#newOrg");
  if (newOrg) newOrg.onclick = startNewOrg;
}

function onRadio(e){
  const name = e.target.name, v = e.target.value;
  if (name === "c1"){ S.c1 = v; }
  else if (name === "c2"){ S.c2 = v; }
  else if (name === "c3"){ S.c3 = +v; }
  else if (name === "c4"){ S.c4 = +v; }
  else {
    if (v === "na"){ S.ans[name] = null; delete S.free[name]; }
    else if (v === "free"){ S.ans[name] = null; S.free[name] = S.free[name] || ""; }
    else { S.ans[name] = +v; delete S.free[name]; }
  }
  save(); render();
}

function onCheck(e){
  const t = e.target;
  if (t.dataset.c5 !== undefined){
    const k = t.dataset.c5;
    if (t.checked){
      if (k === "none" || k === "unknown") S.c5 = [k];
      else S.c5 = S.c5.filter(x => x !== "none" && x !== "unknown").concat(k);
    } else S.c5 = S.c5.filter(x => x !== k);
  } else if (t.dataset.ev !== undefined){
    const id = t.dataset.ev, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.selected = t.checked ? st.selected.concat(t.value) : st.selected.filter(x => x !== t.value);
  } else if (t.dataset.evNone !== undefined){
    const id = t.dataset.evNone, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.none = t.checked; if (t.checked) st.selected = [];
  } else if (t.dataset.evUnknown !== undefined){
    const id = t.dataset.evUnknown, st = S.ev[id] || (S.ev[id] = {selected:[], unknown:false, none:false});
    st.unknown = t.checked; if (t.checked) st.selected = [];
  } else if (t.dataset.fact !== undefined){
    const id = t.dataset.fact, st = S.facts[id] || (S.facts[id] = {checked:[], none:false, unknown:false});
    const level = +t.value;
    st.checked = t.checked ? [...new Set(st.checked.concat(level))].sort((a,b) => a-b) : st.checked.filter(x => x !== level);
    st.none = false; st.unknown = false; S.ans[id] = deriveFactAnswer(st);
  } else if (t.dataset.factNone !== undefined){
    const id = t.dataset.factNone, st = S.facts[id] || (S.facts[id] = {checked:[], none:false, unknown:false});
    st.none = t.checked; if (t.checked){ st.checked = []; st.unknown = false; } S.ans[id] = deriveFactAnswer(st);
  } else if (t.dataset.factUnknown !== undefined){
    const id = t.dataset.factUnknown, st = S.facts[id] || (S.facts[id] = {checked:[], none:false, unknown:false});
    st.unknown = t.checked; if (t.checked){ st.checked = []; st.none = false; } S.ans[id] = deriveFactAnswer(st);
  }
  save(); render();
}

function onText(e){
  const t = e.target;
  if (t.id === "org") S.org = t.value;
  else if (t.dataset.free !== undefined) S.free[t.dataset.free] = t.value;
  else if (t.dataset.cfree === "c1") S.c1_free = t.value;
  else if (t.dataset.cfree === "c2") S.c2_free = t.value;
  save();
  updateProgress();                          // без render(): не збиваємо курсор
}

/* --- валідація ------------------------------------------------------------- */
function answered(q){
  if (q.ev){ const st = S.ev[q.id]; return !!st && (st.selected.length > 0 || st.unknown || st.none); }
  if (q.f) return isFactAnswered(S.facts[q.id]);
  return S.ans[q.id] !== undefined;
}
function stepValid(){
  const s = STEPS[step];
  if (s.ctx) return S.org.trim().length >= 2 && !!S.c1 && !!S.c2 && !!S.c3 && !!S.c4 && S.c5.length > 0;
  return s.ids.every(id => answered(QBY[id]));
}
function onNext(){
  if (!stepValid()){ showedErrors = true; render();
    const bad = document.querySelector(".err-msg");
    if (bad){
      const field = bad.closest(".q").querySelector("input:not([disabled])");
      field?.focus({preventScroll:true}); bad.closest(".q").scrollIntoView({block:"center"});
      $("#formFeedback").textContent = "Заповніть пропущені відповіді. " + bad.textContent;
    }
    return; }
  showedErrors = false;
  $("#formFeedback").textContent = "";
  const act = activeSteps(), i = act.indexOf(step);
  if (i + 1 < act.length){ step = act[i+1]; render(); }
  else { step = STEPS.length; render(); submit(); }
}

/* --- індивідуальний бал ----------------------------------------------------
   Рахуємо лише власну оцінку респондента. Enterprise aggregate, Alignment,
   Confidence і gates рахуються на сервері — вони за визначенням потребують
   усіх респондентів організації.
   --------------------------------------------------------------------------- */
function domainScores(){
  const out = {};
  for (const d of DOMAINS){
    const vals = d.i.map(id => S.ans[id]).filter(v => typeof v === "number");
    out[d.k] = vals.length >= d.m ? +(vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(3) : null;
  }
  return out;
}
function score(){
  const ds = domainScores();
  let num = 0, den = 0;
  for (const d of DOMAINS) if (ds[d.k] !== null){ num += ds[d.k] * d.w; den += d.w; }
  return den ? +(num / den).toFixed(2) : null;
}
function levelOf(sc){
  if (sc === null) return null;
  return LEVELS.find(([lo,hi]) => sc >= lo && sc <= hi) || LEVELS[LEVELS.length-1];
}

/* --- контакт координатора: окремий insert у diagnostic.contacts --- */
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function sendLead(){
  const email = S.email.trim();
  if (!EMAIL_RE.test(email) || email.length > 254){ S.lead = "bad"; render(); return; }
  if (S.sent !== "ok") return;
  S.lead = "wait"; render();
  anonToken().then(tok => fetch(API_URL.replace(/\/+$/, "") + "/contacts", {
    method:"POST",
    headers: Object.assign({"Content-Type":"application/json","Prefer":"return=minimal"},
                           tok ? {"Authorization":"Bearer " + tok} : {}),
    body: JSON.stringify({org_code: S.code, email, name: S.name.trim() || null,
                          kind:"coordinator", consent_version: CONSENT_VERSION}),
  })).then(r => {
    S.lead = r.ok ? "ok" : "err";
    if (!r.ok) console.error("POST /contacts", r.status);
    save(); render();
  }).catch(e => { console.error(e); S.lead = "err"; save(); render(); });
}
function setStatus(state){
  const el = $("#sendStatus"); if (!el) return;
  if (state === "ok")        el.innerHTML = `<div class="status ok">Відповіді надіслані.</div>`;
  else if (state === "wait") el.innerHTML = `<div class="status wait">Надсилаємо…</div>`;
  else if (state === "local")el.innerHTML = `<div class="status wait">Локальний режим: сервер не налаштований. Збережіть копію відповідей і передайте її консультанту.</div>`;
  else if (state === "err")  el.innerHTML = `<div class="status bad">Не вдалося надіслати відповіді. Збережіть копію й передайте консультанту.</div>`;
  else el.innerHTML = "";
}

/* --- payload і надсилання --------------------------------------------------- */
function payload(){
  const answers = {}, evidence = {}, facts = {}, facts_flags = {};
  for (const q of Q){
    if (q.ev){
      const st = S.ev[q.id] || {selected:[], unknown:false, none:false};
      evidence[q.id] = {selected: st.selected, unknown: !!st.unknown, none: !!st.none};
    } else if (q.f) {
      const st = S.facts[q.id] || {checked:[], none:false, unknown:false};
      const checked = [...new Set(st.checked || [])].filter(Number.isInteger).sort((a,b) => a-b);
      answers[q.id] = deriveFactAnswer({checked, none:!!st.none, unknown:!!st.unknown});
      facts[q.id] = {checked, none:!!st.none, unknown:!!st.unknown};
      const flags = factFlags(facts[q.id]);
      if (flags.length) facts_flags[q.id] = flags;
    } else {
      answers[q.id] = S.ans[q.id] === undefined ? null : S.ans[q.id];
    }
  }
  const fn = FUNCTIONS.find(f => f[0] === S.c2);
  if (!S.id) S.id = crypto.randomUUID();
  return {
    id: S.id,
    version: VERSION,
    org_name: S.org.trim(),
    org_code: S.code,
    consent_at: S.consentAt,
    consent_version: CONSENT_VERSION,
    role_group: roleGroup(),
    c1_role: S.c1 === "free" ? S.c1_free : S.c1,
    c2_function: S.c2 === "other" ? (S.c2_free || "Інше") : (fn ? fn[1] : S.c2),
    c3_scope: S.c3, c4_awareness: S.c4,
    c5_types: S.c5,
    answers, facts, facts_flags, evidence,
    free_text: S.free,
    domains: domainScores(),
    score: score(),
    agentic_shown: true,
    duration_sec: Math.round((Date.now() - S.started) / 1000),
  };
}


function anonToken(){
  if (!AUTH_URL) return Promise.resolve(null);
  return fetch(AUTH_URL.replace(/\/+$/, "") + "/token/anonymous")
    .then(r => { if (!r.ok) throw new Error("anon token " + r.status); return r.json(); })
    .then(d => d.token || d.access_token || d.jwt || (d.data && d.data.token) || null);
}

function submit(){
  if (!API_URL){ S.sent = "local"; setStatus("local"); save(); return; }
  S.sent = "wait"; setStatus("wait");
  anonToken().then(tok => fetch(API_URL.replace(/\/+$/, "") + "/responses", {
    method:"POST",
    headers: Object.assign({"Content-Type":"application/json","Prefer":"return=minimal"},
                           tok ? {"Authorization":"Bearer " + tok} : {}),
    body: JSON.stringify(payload()),
  })).then(r => {
    S.sent = r.ok ? "ok" : "err";
    if (!r.ok) console.error("POST /responses", r.status);
    save(); render();                        // render, а не setStatus: оживає кнопка контакту
  }).catch(e => { console.error(e); S.sent = "err"; save(); render(); });
}

function download(){
  const blob = new Blob([JSON.stringify(payload(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ai-readiness-" + (S.org.trim().replace(/\s+/g,"-").toLowerCase() || "response") + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}

/* --- збереження в браузері -------------------------------------------------- */
const KEY = "ainoia-ard-v" + VERSION;
let draftSaved = null;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({S, step})); draftSaved = true; }
  catch(e){ draftSaved = false; }
  updateDraftStatus();
}
function updateDraftStatus(){
  const el = $("#draftStatus");
  if (el) el.textContent = draftSaved === false ? "Чернетку не збережено. Не закривайте вкладку." : draftSaved === true ? "Чернетку збережено у браузері" : "";
}
function restore(){
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.S){ Object.assign(S, d.S); if (typeof d.step === "number") step = d.step; }
  } catch(e){}
}

/* --- старт ------------------------------------------------------------------ */
restore();
const qs = new URLSearchParams(location.search);
function validOrgCodeParam(){
  const v = (qs.get("org") || "").trim();
  return CODE_RE.test(v.toUpperCase()) ? v.toUpperCase() : null;
}
function resetForRespondent(code){
  Object.assign(S, {org:"", code, codeFromLink:true, invitedBy:"", consentAt:null, id:null,
    c1:"", c1_free:"", c2:"", c2_free:"", c3:null, c4:null, c5:[], c5_free:"",
    ans:{}, facts:{}, ev:{}, free:{}, started:Date.now(), sent:null, email:"", name:"", lead:null});
  step = -1;
}
/* Координатор явно починає анкету для іншої організації: без цього повторний
   заїзд на "чистий" URL у тому ж браузері підхопив би зі сховища код і чернетку
   попередньої компанії (localStorage-ключ спільний для всіх анкет на цьому пристрої). */
function startNewOrg(){
  if (!confirm("Розпочати анкету для нової організації? Поточну чернетку в цьому браузері буде очищено."))
    return;
  try { localStorage.removeItem(KEY); } catch(e){}
  Object.assign(S, {org:"", code:genCode(), codeFromLink:false, invitedBy:"", consentAt:null, id:null,
    c1:"", c1_free:"", c2:"", c2_free:"", c3:null, c4:null, c5:[], c5_free:"",
    ans:{}, facts:{}, ev:{}, free:{}, started:Date.now(), sent:null, email:"", name:"", lead:null});
  step = -1; showedErrors = false;
  save(); render();
}
function applyLegacyOrgParam(){
  const v = (qs.get("org") || "").trim();
  if (v && !S.org) S.org = v;              // старі посилання з назвою організації
}
/* Ім'я того, хто запросив: ?from=Олена Петренко — для довіри на титульній. */
function applyFromParam(){
  const v = (qs.get("from") || "").trim().replace(/\s+/g, " ").slice(0, 60);
  if (v) S.invitedBy = v;
}
if (qs.get("reset") !== null){ try { localStorage.removeItem(KEY); } catch(e){}
  Object.assign(S, {org:"", code:"", codeFromLink:false, invitedBy:"", consentAt:null, id:null, c1:"", c2:"", c3:null, c4:null, c5:[],
                    ans:{}, facts:{}, ev:{}, free:{}, sent:null, email:"", name:"", lead:null});
  step = -1; }
URL_ORG_CODE = validOrgCodeParam();
if (URL_ORG_CODE){
  // A link is authoritative: never let a completed coordinator session become a respondent session.
  if (S.code !== URL_ORG_CODE || !S.codeFromLink) resetForRespondent(URL_ORG_CODE);
  else { S.code = URL_ORG_CODE; S.codeFromLink = true; }
  applyFromParam();
} else if (S.sent === null){
  applyLegacyOrgParam(); applyFromParam();
}
if (!S.code) S.code = genCode();
render();
</script>
